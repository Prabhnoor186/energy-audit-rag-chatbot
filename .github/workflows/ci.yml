name: "CI - Validate and Package"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Terraform init (no AWS credentials needed for validate)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  validate-python:
    name: Lint Python code
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linter
        run: pip install flake8

      - name: Run flake8
        run: flake8 . --max-line-length=120 --extend-ignore=E501,W503

  package-lambda:
    name: Build Lambda deployment package
    runs-on: ubuntu-latest
    needs: [validate-terraform, validate-python]
    steps:
      - name: Check out the repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies into package folder (Lambda-compatible, Linux)
        run: |
          mkdir -p lambda_package
          pip install opensearch-py requests -t lambda_package \
            --platform manylinux2014_x86_64 --python-version 3.12 \
            --implementation cp --only-binary=:all:
          cp lambda_function.py lambda_package/

      - name: Zip the package
        run: cd lambda_package && zip -r ../lambda_package.zip .

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda_package
          path: lambda_package.zip
          retention-days: 7
